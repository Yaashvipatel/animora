<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animora - Adoption</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="adoption.css" />
</head>

<body>

  <main class="adopt-page">

    <header class="page-top">
      <h2>🐾 Adoption</h2>
      <p>Find your new best friend 💙</p>
    </header>

    <section class="card">
      <h3 class="sec-title">Pets Available</h3>

      <div id="petGrid" class="pet-grid">
        <p class="muted">Loading pets...</p>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="menu.html" class="nav-item"><span class="icon">☰</span><span>Menu</span></a>
    <a href="index.html" class="nav-item"><span class="icon">🏠</span><span>Home</span></a>
    <a href="doctor.html" class="nav-item"><span class="icon">🩺</span><span>Doctor</span></a>
    <a href="shopping.html" class="nav-item"><span class="icon">🛒</span><span>Shopping</span></a>
    <a href="profile.html" class="nav-item"><span class="icon">👤</span><span>Profile</span></a>
  </nav>

  <script>
    const API = "http://localhost:8000";
    const petGrid = document.getElementById("petGrid");

    async function loadPets() {
      try {
        const res = await fetch(API + "/api/adoption/pets?limit=50");
        const data = await res.json();

        if (!res.ok) {
          petGrid.innerHTML = "<p class='muted'>Failed to load pets ❌</p>";
          return;
        }

        const pets = data.pets || [];

        if (!pets || pets.length === 0) {
          petGrid.innerHTML = "<p class='muted'>No pets available currently 🥲</p>";
          return;
        }

        petGrid.innerHTML = "";

        pets.forEach(function (p) {
          const div = document.createElement("div");
          div.className = "pet-card";

          div.innerHTML = `
            <div class="pet-img">
              ${p.image ? `<img src="${p.image}" alt="${p.name}" />` : "🐶"}
            </div>

            <div class="pet-body">
              <h4>${p.name}</h4>
              <p class="muted small">${p.type} • ${p.age} • ${p.gender}</p>

              <div class="tags">
                ${p.vaccinated ? `<span class="tag good">Vaccinated</span>` : ""}
                ${p.neutered ? `<span class="tag ok">Neutered</span>` : ""}
                ${p.nature ? `<span class="tag">${p.nature}</span>` : ""}
              </div>

              <p class="muted small">
                📍 ${p.centreName}, ${p.city}
              </p>

              <button class="btn primary full" onclick='openDetails(${JSON.stringify(p)})'>
                View Details
              </button>
            </div>
          `;

          petGrid.appendChild(div);
        });

      } catch (error) {
        console.log(error);
        petGrid.innerHTML = "<p class='muted'>Server error ❌</p>";
      }
    }

    function openDetails(pet) {
      localStorage.setItem("selectedPet", JSON.stringify(pet));
      window.location.href = "pet-details.html";
    }

    loadPets();
  </script>

</body>
</html>
