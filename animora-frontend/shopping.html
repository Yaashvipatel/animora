<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animora - Shopping</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="shopping.css" />
</head>

<body>

  <main class="shop-page">

    <header class="shop-top">
      <div class="shop-left">
        <h2>🛒 Animora Shop</h2>
        <p>Best essentials for your pet</p>
      </div>

      <div class="shop-right">
        <a href="cart.html" class="cart-btn">
          🧺 Cart <span id="cartCount">0</span>
        </a>

        <button class="logout-btn" onclick="logoutUser()">Logout</button>
      </div>
    </header>

    <section class="card">
      <h3 class="sec-title">Products</h3>

      <div id="productList" class="product-grid">
        <p class="muted">Loading products...</p>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="menu.html" class="nav-item"><span class="icon">☰</span><span>Menu</span></a>
    <a href="index.html" class="nav-item"><span class="icon">🏠</span><span>Home</span></a>
    <a href="doctor.html" class="nav-item"><span class="icon">🩺</span><span>Doctor</span></a>
    <a href="shopping.html" class="nav-item active"><span class="icon">🛒</span><span>Shopping</span></a>
    <a href="profile.html" class="nav-item"><span class="icon">👤</span><span>Profile</span></a>
  </nav>

  <script>
    const API = "http://localhost:8000";
    const productList = document.getElementById("productList");
    const cartCount = document.getElementById("cartCount");

    function getCart() {
      return JSON.parse(localStorage.getItem("cart")) || [];
    }

    function saveCart(cart) {
      localStorage.setItem("cart", JSON.stringify(cart));
      updateCartCount();
    }

    function updateCartCount() {
      const cart = getCart();
      cartCount.innerText = cart.reduce((sum, item) => sum + item.qty, 0);
    }

    function addToCart(product) {
      let cart = getCart();
      const existing = cart.find((p) => p._id === product._id);

      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }

      saveCart(cart);
      alert("Added to cart ✅");
    }

    function logoutUser() {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      alert("Logged out ✅");
      window.location.href = "profile.html";
    }

    async function loadProducts() {
      try {
        const res = await fetch(API + "/api/products?limit=100");
        const data = await res.json();

        if (!res.ok) {
          productList.innerHTML = "<p class='muted'>Failed to load products ❌</p>";
          return;
        }

        const products = data.products || [];

        if (!products || products.length === 0) {
          productList.innerHTML = "<p class='muted'>No products available right now 🥲</p>";
          return;
        }

        productList.innerHTML = "";

        products.forEach(function (p) {
          const div = document.createElement("div");
          div.className = "product-card";

          div.innerHTML = `
            <div class="product-img">
              ${p.image ? `<img src="${p.image}" alt="${p.name}">` : "🐾"}
            </div>

            <h4>${p.name}</h4>
            <p class="muted small">${p.category}</p>

            <p class="price">₹${p.price}</p>
            <p class="muted small">${p.description || ""}</p>

            <button class="btn primary full" ${p.inStock ? "" : "disabled"}>
              ${p.inStock ? "Add to Cart" : "Out of Stock"}
            </button>
          `;

          const btn = div.querySelector("button");
          btn.addEventListener("click", function () {
            addToCart(p);
          });

          productList.appendChild(div);
        });

      } catch (error) {
        console.log(error);
        productList.innerHTML = "<p class='muted'>Server error ❌</p>";
      }
    }

    updateCartCount();
    loadProducts();
  </script>

</body>
</html>
